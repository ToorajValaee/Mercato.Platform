name: Core and POS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: core-pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-pos:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercato
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mercato"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Mercato
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare PostgreSQL test databases
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          for db in mercato_test mercato_pos_smoke; do
            docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS ${db};"
            docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE ${db};"
          done

      - name: Restore backend
        run: dotnet restore backend/Mercato.Platform.sln

      - name: Build backend
        run: dotnet build backend/Mercato.Platform.sln --configuration Release --no-restore

      - name: Validate browser JavaScript syntax
        run: |
          set -euo pipefail
          node --check backend/src/Mercato.Api/wwwroot/mercato-ui.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('admin', 'pos'):
              html = Path(f'backend/src/Mercato.Api/wwwroot/{name}/index.html').read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.I | re.S)
              Path(f'/tmp/{name}-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js
          node --check /tmp/pos-inline.js

      - name: Run POS Docker runtime smoke test
        env:
          MERCATO_POS_BASE_URL: http://127.0.0.1:5081
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          NETWORK="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$PG_CONTAINER")"
          test -n "$NETWORK"

          docker build -f backend/Dockerfile -t mercato-api-pos-smoke:ci .
          docker run -d \
            --name mercato-pos-smoke-api \
            --network "$NETWORK" \
            -p 5081:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e 'MERCATO_CONNECTION_STRING=Host=postgres;Port=5432;Database=mercato_pos_smoke;Username=postgres;Password=postgres' \
            -e Jwt__Issuer=Mercato.Api \
            -e Jwt__Audience=Mercato.Client \
            -e Jwt__Key=Mercato-POS-Smoke-JWT-Key-Change-Me-2026 \
            -e BootstrapAdmin__Email=admin@mercato.local \
            -e 'BootstrapAdmin__Password=MercatoLocal123!' \
            -e BootstrapDemoData__Enabled=true \
            mercato-api-pos-smoke:ci

          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              docker logs mercato-pos-smoke-api >&2 || true
            fi
            docker rm -f mercato-pos-smoke-api >/dev/null 2>&1 || true
            exit $status
          }
          trap cleanup EXIT

          bash backend/pos-http-smoke.sh
          if docker logs mercato-pos-smoke-api 2>&1 | grep -Eiq 'Unhandled exception|crit:'; then
            echo "Mercato POS Docker runtime log contains an unexpected failure." >&2
            docker logs mercato-pos-smoke-api >&2 || true
            exit 1
          fi

      - name: Test backend
        env:
          MERCATO_TEST_DB_CONNECTION: Host=127.0.0.1;Port=55432;Database=mercato_test;Username=postgres;Password=postgres
        run: dotnet test backend/Mercato.Platform.sln --configuration Release --no-build
