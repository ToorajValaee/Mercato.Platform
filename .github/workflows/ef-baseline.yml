name: Generate EF Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ef-baseline.yml'

permissions:
  contents: write

jobs:
  generate-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install EF tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore backend
        run: dotnet restore backend/Mercato.Platform.sln

      - name: Generate initial migration
        run: |
          set -euo pipefail
          if find backend/src/Mercato.Infrastructure/Data/Migrations -maxdepth 1 -name '*.cs' -print -quit 2>/dev/null | grep -q .; then
            echo 'EF migration files already exist; refusing to create a second baseline.' >&2
            exit 1
          fi
          dotnet ef migrations add InitialBaseline \
            --project backend/src/Mercato.Infrastructure/Mercato.Infrastructure.csproj \
            --startup-project backend/src/Mercato.Api/Mercato.Api.csproj \
            --output-dir Data/Migrations

      - name: Verify generated migration builds
        run: dotnet build backend/Mercato.Platform.sln --configuration Release --no-restore

      - name: Commit generated migration
        run: |
          set -euo pipefail
          git add backend/src/Mercato.Infrastructure/Data/Migrations
          if git diff --cached --quiet; then
            echo 'No migration files were generated.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add initial EF Core migration baseline'
          git push origin HEAD:${GITHUB_REF_NAME}
