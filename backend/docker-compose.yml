services:
  postgres:
    image: postgres:17
    container_name: mercato-postgres
    environment:
      POSTGRES_DB: mercato
      POSTGRES_USER: mercato
      POSTGRES_PASSWORD: mercato
    ports:
      - "5432:5432"
    volumes:
      - mercato-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercato-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mercato;Username=mercato;Password=mercato
    ports:
      - "8080:8080"

volumes:
  mercato-postgres-data:
