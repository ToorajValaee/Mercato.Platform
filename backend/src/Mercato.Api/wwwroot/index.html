<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f6f8;color:#17202a;min-height:100vh;display:grid;place-items:center}.wrap{width:min(900px,calc(100% - 32px))}.brand{font-weight:800;font-size:28px;margin-bottom:8px}.sub{color:#64717e;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:26px;box-shadow:0 12px 28px rgba(21,35,49,.06);transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(21,35,49,.1)}.icon{width:48px;height:48px;border-radius:14px;background:#2d5b4f;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:20px}.card h2{margin:0 0 8px}.card p{margin:0;color:#65717f;line-height:1.55}.go{margin-top:22px;color:#2d5b4f;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">Mercato Platform</div><div class="sub">Choose the workspace you need.</div><div class="grid"><a class="card" href="/pos/"><div class="icon">POS</div><h2>Point of Sale</h2><p>Cashier workflow for branch sales, receipts, order lookup and returns.</p><div class="go">Open POS →</div></a><a class="card" href="/admin/"><div class="icon">BO</div><h2>Back Office</h2><p>Catalog, inventory, branches, customers, invoices, settlements, accounting and staff administration.</p><div class="go">Open Back Office →</div></a></div></main></body></html>
