<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato POS</title>
<script src="/mercato-ui.js"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#f5f5f4;--line:#e4e4e7;--muted:#71717a;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--panel:#fff;--shadow:0 5px 20px #0000000a}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 18px;background:#111827;color:#fff;box-shadow:0 2px 12px #0002}.brand{font-size:20px;font-weight:850}.status{font-size:12px;color:#d1d5db;margin-top:2px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-actions .mcombo{min-width:210px;color:#111827}.shell{max-width:1580px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.login{width:min(460px,calc(100vw - 30px));margin:8vh auto;padding:28px}.login h1{margin-bottom:6px}.field{width:100%;border:1px solid #d6d3d1;border-radius:9px;padding:10px 12px;background:#fff;outline:none}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb20}label{display:block;font-size:13px;font-weight:750;color:#57534e;margin:12px 0 6px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:760;background:#e7e5e4;color:#1c1917;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.success{background:var(--green);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.ghost{background:transparent;border:1px solid #d6d3d1}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(350px,.8fr);gap:18px}.catalog{padding:15px;min-height:72vh}.catalog-head{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:9px;margin-bottom:14px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:155px;background:#fff}.product-image{height:125px;border-radius:9px;object-fit:cover;width:100%;background:#f4f4f5;margin-bottom:10px}.product-name{font-weight:850;line-height:1.25}.sku{font-size:11px;color:var(--muted);margin-top:4px}.price{margin-top:auto;font-size:19px;font-weight:850;padding-top:8px}.stock{font-size:12px;color:#57534e;margin:3px 0 9px}.stock.zero{color:var(--red);font-weight:700}.side{display:flex;flex-direction:column;gap:14px}.panel{padding:15px}.panel h2{margin:0 0 12px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:5px}.qty span{min-width:24px;text-align:center;font-weight:800}.muted{color:var(--muted);font-size:12px}.total-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.total-row.grand{font-size:21px;font-weight:900;border-top:1px solid var(--line);padding-top:10px;margin-top:5px}.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}.customer-card{border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:11px;margin-top:8px}.customer-card.good{border-color:#bbf7d0;background:#f0fdf4}.customer-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border:1px dashed #a8a29e;border-radius:10px;padding:14px;background:#fafaf9}.receipt-row{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.receipt hr{border:0;border-top:1px dashed #a8a29e;margin:10px 0}.return-line{display:grid;grid-template-columns:1fr 88px;gap:10px;border-bottom:1px solid #eee;padding:9px 0;align-items:end}.notice,.error{padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}.notice{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.empty{padding:28px 10px;text-align:center;color:var(--muted)}footer{text-align:center;color:#78716c;font-size:12px;padding:22px}footer a{color:inherit;font-weight:800;text-decoration:none}.lang{min-width:105px}.no-image .product-image{display:none}@media(max-width:940px){.workspace{grid-template-columns:1fr}.catalog-head{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions>*{flex:1}.top-actions .mcombo{min-width:0}.checkout-grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;inset:0;width:100%;border:0;box-shadow:none}.no-print{display:none!important}}
</style>
</head>
<body>
<section id="loginView" class="card login">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Mercato POS</h1><div class="muted">Sign in with an Admin, Manager, or Cashier account.</div></div><select id="loginLanguage" class="field lang no-search"><option value="en">English</option><option value="fa">فارسی</option></select></div>
  <form id="loginForm"><label>Email</label><input id="email" class="field" type="email" autocomplete="username" required><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password" required><button class="btn primary" style="width:100%;margin-top:18px" type="submit">Sign in</button></form>
  <div id="loginError" class="error hidden" style="margin-top:12px"></div>
</section>

<section id="appView" class="hidden">
<header class="topbar">
  <div><div class="brand">Mercato POS</div><div id="staffLabel" class="status"></div></div>
  <div class="top-actions"><select id="branchSelect" class="field"></select><select id="language" class="field lang no-search"><option value="en">English</option><option value="fa">فارسی</option></select><button id="refreshBtn" class="btn small">Refresh stock</button><button id="logoutBtn" class="btn small">Sign out</button></div>
</header>
<main class="shell">
  <div id="globalError" class="error hidden"></div><div id="globalNotice" class="notice hidden"></div>
  <div class="workspace">
    <section class="card catalog"><div class="catalog-head"><input id="searchInput" class="field" type="search" placeholder="Search product name or SKU…"><select id="stockFilter" class="field"><option value="all">All products</option><option value="in">In stock</option><option value="out">Out of stock</option></select></div><div id="products" class="products"></div></section>
    <aside class="side">
      <section class="card panel">
        <h2>Cart</h2><div id="cart"></div>
        <div class="total-row"><span>Subtotal</span><strong id="cartSubtotal">0.00</strong></div><div class="total-row"><span>Discount</span><strong id="cartDiscount">0.00</strong></div><div class="total-row grand"><span>Total</span><span id="cartTotal">0.00</span></div>
        <div class="checkout-grid">
          <label class="wide">Payment method<select id="paymentMethod" class="field"></select></label>
          <label class="wide">Discount<select id="discountSelect" class="field"></select></label>
          <div class="wide"><label>Mobile number</label><input id="customerPhone" class="field" type="tel" autocomplete="tel" placeholder="09..."><div id="customerStatus"></div></div>
          <button id="clearCartBtn" class="btn">Clear</button><button id="checkoutBtn" class="btn success">Pay</button>
        </div>
      </section>

      <section id="receiptPanel" class="card panel hidden printable"><h2>Receipt</h2><div id="receipt" class="receipt"></div><div class="no-print" style="display:flex;gap:8px;margin-top:12px"><button id="printBtn" class="btn">Print</button><button id="prepareReturnBtn" class="btn">Return items</button></div></section>

      <section class="card panel no-print"><h2>Return / Refund</h2><label>Order ID</label><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="returnOrderId" class="field" placeholder="Paste an order ID"><button id="loadOrderBtn" class="btn">Load</button></div><div id="returnOrder" style="margin-top:10px"></div><label>Refund method<select id="refundMethod" class="field"></select></label><button id="submitReturnBtn" class="btn danger" style="width:100%;margin-top:12px" disabled>Refund selected quantities</button></section>
    </aside>
  </div>
</main>
<footer>Powered by <a href="https://badje.ir" target="_blank" rel="noopener">badje.ir</a></footer>
</section>
<script>
(() => {
const state={token:null,user:null,branches:[],branchId:null,catalog:[],cart:new Map(),receipt:null,returnOrder:null,settings:{paymentMethods:[],discounts:[],posShowProductImages:false,systemLanguage:'en'},customer:null,customerLookupTimer:null};
const $=id=>document.getElementById(id),guidEmpty='00000000-0000-0000-0000-000000000000';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>MercatoUI.money(v),fmtDate=v=>MercatoUI.fmtDate(v);
function msg(text,kind='error'){const a=$(kind==='notice'?'globalNotice':'globalError'),b=$(kind==='notice'?'globalError':'globalNotice');b.classList.add('hidden');a.textContent=text;a.classList.toggle('hidden',!text);if(text)setTimeout(()=>a.classList.add('hidden'),5500)}
async function api(path,options={}){const h={...(options.headers||{})};if(state.token)h.Authorization=`Bearer ${state.token}`;if(options.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(path,{...options,headers:h});const text=await r.text();let data=null;if(text){try{data=JSON.parse(text)}catch{data=text}}if(!r.ok){if(r.status===401&&state.token)logout();const e=new Error(data?.error||data?.title||(typeof data==='string'?data:`Request failed (${r.status})`));e.status=r.status;throw e}return data}
async function loadPublicSettings(){try{const x=await api('/api/settings/public');state.settings=x||state.settings;MercatoUI.setLanguage(x.systemLanguage||MercatoUI.getLanguage());syncLanguage();return x}catch{return null}}
function syncLanguage(){const l=MercatoUI.getLanguage();$('language').value=l;$('loginLanguage').value=l;MercatoUI.apply()}
$('language').onchange=e=>{MercatoUI.setLanguage(e.target.value);syncLanguage();renderProducts();renderCart();renderReturnOrder();if(state.receipt)renderReceipt(state.receipt)};$('loginLanguage').onchange=e=>{MercatoUI.setLanguage(e.target.value);syncLanguage()};
async function login(email,password){const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});if(!['Admin','Manager','Cashier'].includes(x.user?.role))throw new Error('This account cannot use POS.');state.token=x.token;state.user=x.user;sessionStorage.setItem('mercato.pos.token',x.token);sessionStorage.setItem('mercato.pos.user',JSON.stringify(x.user));await enterApp()}
async function enterApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('staffLabel').textContent=`${state.user?.email||'Staff'} · ${state.user?.role||''}`;await loadSettings();await loadBranches();}
function logout(){state.token=null;state.user=null;state.cart.clear();state.customer=null;sessionStorage.removeItem('mercato.pos.token');sessionStorage.removeItem('mercato.pos.user');$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function loadSettings(){const x=await api('/api/settings/public');state.settings=x;MercatoUI.setLanguage(x.systemLanguage||MercatoUI.getLanguage());syncLanguage();fillOptions();document.body.classList.toggle('no-image',!x.posShowProductImages)}
function fillOptions(){const p=state.settings.paymentMethods||[],d=state.settings.discounts||[];$('paymentMethod').innerHTML=p.length?p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option value="">No records found.</option>';$('refundMethod').innerHTML=p.length?p.map(x=>`<option value="${x.name}">${esc(x.name)}</option>`).join(''):'<option value="">No records found.</option>';$('discountSelect').innerHTML='<option value="">No discount</option>'+d.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.type==='Percent'?`${x.value}%`:money(x.value)}</option>`).join('');MercatoUI.enhanceSelects();document.querySelectorAll('.mcombo').forEach(MercatoUI.syncCombo)}
async function loadBranches(){state.branches=await api('/api/branches/accessible');if(!state.branches.length){$('branchSelect').innerHTML='<option value="">No branches configured</option>';state.branchId=null;state.catalog=[];renderProducts();msg('No branches assigned to this staff account.');return}const prev=state.branchId;$('branchSelect').innerHTML=state.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');state.branchId=state.branches.some(x=>x.id===prev)?prev:state.branches[0].id;$('branchSelect').value=state.branchId;MercatoUI.enhanceSelects();document.querySelectorAll('.mcombo').forEach(MercatoUI.syncCombo);state.cart.clear();renderCart();await loadCatalog()}
async function loadCatalog(){if(!state.branchId)return;state.catalog=await api(`/api/catalog?branchId=${encodeURIComponent(state.branchId)}`);renderProducts();renderCart()}
function filtered(){const q=$('searchInput').value.trim().toLowerCase(),f=$('stockFilter').value;return state.catalog.filter(p=>{const match=!q||`${p.name} ${p.sku||''}`.toLowerCase().includes(q),stock=Number(p.availableQuantity||0);return match&&(f==='all'||(f==='in'?stock>0:stock<=0))})}
function renderProducts(){const items=filtered();$('products').innerHTML=items.length?items.map(p=>{const stock=Number(p.availableQuantity||0),image=state.settings.posShowProductImages&&p.imageUrl?`<img class="product-image" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'';return`<article class="product">${image}<div class="product-name">${esc(p.name)}</div><div class="sku">${esc(p.sku||p.productId)}</div><div class="price">${money(p.salePrice)}</div><div class="stock ${stock<=0?'zero':''}">${stock} ${MercatoUI.t('Available')}</div><button class="btn primary add-product" data-id="${p.productId}" ${stock<=0?'disabled':''}>${MercatoUI.t('Add to cart')}</button></article>`}).join(''):`<div class="empty">${MercatoUI.t('No products match this view.')}</div>`}
function discountAmount(subtotal){const id=$('discountSelect').value,d=(state.settings.discounts||[]).find(x=>x.id===id);if(!d)return 0;const v=d.type==='Percent'?subtotal*Number(d.value)/100:Number(d.value);return Math.min(subtotal,Math.max(0,Math.round(v*100)/100))}
function renderCart(){const lines=[...state.cart.entries()].map(([id,q])=>({p:state.catalog.find(x=>x.productId===id),q})).filter(x=>x.p);$('cart').innerHTML=lines.length?lines.map(({p,q})=>`<div class="cart-line"><div><strong>${esc(p.name)}</strong><div class="muted">${money(p.salePrice)} × ${q}</div></div><div class="qty"><button class="btn small qminus" data-id="${p.productId}">−</button><span>${q}</span><button class="btn small qplus" data-id="${p.productId}">+</button></div></div>`).join(''):`<div class="empty">${MercatoUI.t('Cart is empty.')}</div>`;const subtotal=lines.reduce((s,x)=>s+x.q*Number(x.p.salePrice),0),disc=discountAmount(subtotal);$('cartSubtotal').textContent=money(subtotal);$('cartDiscount').textContent=money(disc);$('cartTotal').textContent=money(subtotal-disc);$('checkoutBtn').disabled=!lines.length||!state.branchId||!$('paymentMethod').value}
function add(id){const p=state.catalog.find(x=>x.productId===id);if(!p)return;const q=state.cart.get(id)||0,max=Number(p.availableQuantity||0);if(q>=max)return msg(`Only ${max} unit(s) of ${p.name} are available.`);state.cart.set(id,q+1);renderCart()}
function change(id,delta){const p=state.catalog.find(x=>x.productId===id);if(!p)return;const n=(state.cart.get(id)||0)+delta;if(n<=0)state.cart.delete(id);else if(n<=Number(p.availableQuantity||0))state.cart.set(id,n);else msg(`Only ${p.availableQuantity} unit(s) of ${p.name} are available.`);renderCart()}
function clearCustomer(){state.customer=null;$('customerStatus').innerHTML=''}
async function lookupCustomer(){const phone=$('customerPhone').value.trim();clearCustomer();if(!phone)return;try{const c=await api('/api/customers/by-phone?phone='+encodeURIComponent(phone));state.customer=c;$('customerStatus').innerHTML=`<div class="customer-card good"><div class="customer-head"><strong>${MercatoUI.t('Customer found')}</strong><span>${esc(c.name)}</span></div><div class="muted">${esc(c.phone||'')} ${c.email?' · '+esc(c.email):''}</div></div>`}catch(e){if(e.status!==404)return msg(e.message);$('customerStatus').innerHTML=`<div class="customer-card"><strong>${MercatoUI.t('New customer')}</strong><label>${MercatoUI.t('Name')}</label><input id="quickCustomerName" class="field"><label>${MercatoUI.t('Optional email')}</label><input id="quickCustomerEmail" class="field" type="email"><button id="saveQuickCustomer" class="btn primary" style="margin-top:9px;width:100%">${MercatoUI.t('Save customer')}</button></div>`;$('saveQuickCustomer').onclick=saveQuickCustomer}}
async function saveQuickCustomer(){const name=$('quickCustomerName').value.trim(),phone=$('customerPhone').value.trim(),email=$('quickCustomerEmail').value.trim();if(!name)return msg('Customer name is required.');try{const c=await api('/api/customers',{method:'POST',body:JSON.stringify({name,phone,email:email||null})});state.customer=c;await lookupCustomer();msg('Customer saved','notice')}catch(e){msg(e.message)}}
async function checkout(){if(!state.cart.size)return;const methodId=$('paymentMethod').value;if(!methodId)return msg('Select payment method');const req={branchId:state.branchId,customerId:state.customer?.id||guidEmpty,paymentMethodId:methodId,paymentMethod:'',discountId:$('discountSelect').value||null,idempotencyKey:`pos:${crypto.randomUUID?crypto.randomUUID():Date.now()}`,items:[...state.cart.entries()].map(([productId,quantity])=>({productId,quantity}))};$('checkoutBtn').disabled=true;try{const r=await api('/api/pos/checkout',{method:'POST',body:JSON.stringify(req)});state.receipt=r;renderReceipt(r);$('receiptPanel').classList.remove('hidden');$('returnOrderId').value=r.orderId;state.cart.clear();renderCart();msg(`Sale completed. Order ${r.orderId}`,'notice');await loadCatalog()}catch(e){msg(e.message);renderCart()}}
function renderReceipt(r){const lines=(r.items||[]).map(x=>`<div class="receipt-row"><span>${esc(x.name)} × ${x.quantity}</span><span>${money(x.lineTotal)}</span></div>`).join('');$('receipt').innerHTML=`<div><strong>Mercato POS</strong></div><div class="muted">Order ${esc(r.orderId)}</div><div class="muted">${esc(fmtDate(r.paidAtUtc))}</div>${state.customer?`<div class="muted">${esc(state.customer.name)} · ${esc(state.customer.phone||'')}</div>`:''}<hr>${lines}<hr><div class="receipt-row"><span>${MercatoUI.t('Subtotal')}</span><span>${money(r.subtotal??r.total)}</span></div>${Number(r.discountAmount)>0?`<div class="receipt-row"><span>${MercatoUI.t('Discount')} ${esc(r.discountName||'')}</span><span>−${money(r.discountAmount)}</span></div>`:''}<div class="receipt-row"><strong>${MercatoUI.t('Total')}</strong><strong>${money(r.total)}</strong></div><div class="receipt-row"><span>${MercatoUI.t('Payment method')}</span><span>${esc(r.paymentMethod)}</span></div><div class="receipt-row"><span>${MercatoUI.t('Reference')}</span><span>${esc(r.receiptReference)}</span></div>`}
async function loadReturnOrder(id){id=(id||'').trim();if(!id)return msg('Enter an order ID.');try{state.returnOrder=await api('/api/pos/orders/'+encodeURIComponent(id));renderReturnOrder()}catch(e){state.returnOrder=null;renderReturnOrder();msg(e.message)}}
function renderReturnOrder(){const o=state.returnOrder;if(!o){$('returnOrder').innerHTML=`<div class="muted">${MercatoUI.t('Load')} ${MercatoUI.t('Order ID')}</div>`;$('submitReturnBtn').disabled=true;return}$('returnOrder').innerHTML=`<div class="muted">${fmtDate(o.createdAtUtc)} · ${MercatoUI.t('Total')} ${money(o.totalAmount)}</div>`+o.items.map(x=>`<div class="return-line"><div><strong>${esc(x.productName||x.productId)}</strong><div class="muted">${MercatoUI.t('Sold')}: ${x.soldQuantity} · ${MercatoUI.t('Returned')}: ${x.returnedQuantity} · ${MercatoUI.t('Remaining')}: ${x.returnableQuantity}</div><div class="muted">${money(x.unitPrice)}</div></div><div><label>${MercatoUI.t('Return')}</label><input class="field return-qty" data-id="${x.productId}" type="number" min="0" max="${x.returnableQuantity}" step="1" value="0"></div></div>`).join('');$('submitReturnBtn').disabled=!o.items.some(x=>x.returnableQuantity>0)}
async function submitReturn(){const o=state.returnOrder;if(!o)return;const items=[...document.querySelectorAll('.return-qty')].map(i=>({productId:i.dataset.id,quantity:Number(i.value||0)})).filter(x=>Number.isInteger(x.quantity)&&x.quantity>0);if(!items.length)return msg('Select at least one quantity to return.');const refundMethod=$('refundMethod').value;if(!refundMethod)return msg('Select refund method.');try{const r=await api('/api/pos/returns',{method:'POST',body:JSON.stringify({orderId:o.orderId||o.id,refundMethod,items})});msg(`Refund completed: ${r.reference} · ${money(r.total)}`,'notice');await loadCatalog();await loadReturnOrder(o.orderId||o.id)}catch(e){msg(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').classList.add('hidden');try{await login($('email').value,$('password').value)}catch(err){$('loginError').textContent=err.message;$('loginError').classList.remove('hidden')}};$('logoutBtn').onclick=logout;$('refreshBtn').onclick=()=>loadCatalog().catch(e=>msg(e.message));$('branchSelect').onchange=async e=>{state.branchId=e.target.value||null;state.cart.clear();renderCart();await loadCatalog()};$('searchInput').oninput=renderProducts;$('stockFilter').onchange=renderProducts;$('discountSelect').onchange=renderCart;$('customerPhone').oninput=()=>{clearTimeout(state.customerLookupTimer);clearCustomer();state.customerLookupTimer=setTimeout(lookupCustomer,500)};$('products').onclick=e=>{const b=e.target.closest('.add-product');if(b)add(b.dataset.id)};$('cart').onclick=e=>{const m=e.target.closest('.qminus'),p=e.target.closest('.qplus');if(m)change(m.dataset.id,-1);if(p)change(p.dataset.id,1)};$('clearCartBtn').onclick=()=>{state.cart.clear();renderCart()};$('checkoutBtn').onclick=checkout;$('printBtn').onclick=()=>window.print();$('prepareReturnBtn').onclick=()=>{if(state.receipt)loadReturnOrder(state.receipt.orderId)};$('loadOrderBtn').onclick=()=>loadReturnOrder($('returnOrderId').value);$('submitReturnBtn').onclick=submitReturn;
(async()=>{await loadPublicSettings();const token=sessionStorage.getItem('mercato.pos.token'),user=sessionStorage.getItem('mercato.pos.user');if(token&&user){try{state.token=token;state.user=JSON.parse(user);await enterApp()}catch(e){logout();$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}}renderCart();renderReturnOrder()})()
})();
</script>
</body></html>
