services:
  mercato-api:
    build:
      context: ./backend/src/Mercato.Api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MERCATO_CONNECTION_STRING: Host=postgres;Database=mercato;Username=postgres;Password=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: mercato-postgres
    environment:
      POSTGRES_DB: mercato
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mercato_pgdata:/var/lib/postgresql/data
      - ./backend/src/Mercato.Infrastructure/Data/Scripts:/docker-entrypoint-initdb.d

volumes:
  mercato_pgdata:
